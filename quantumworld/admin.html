<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissions Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto p-6">

    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">
            Admissions Dashboard
        </h1>

        <div class="flex gap-3">
    <button onclick="loadAdmissions()" class="bg-blue-600 text-white px-4 py-2 rounded-xl">
        Refresh
    </button>

    <button onclick="downloadCSV()" class="bg-green-600 text-white px-4 py-2 rounded-xl">
        Download Excel
    </button>
</div>
    </div>
<div class="grid grid-cols-3 gap-4 mb-6">
  <div class="bg-white p-5 rounded-2xl shadow">
    <h3 class="text-gray-500">Total Applications</h3>
    <p id="totalApps" class="text-4xl font-bold text-blue-600">0</p>
  </div>

  <div class="bg-white p-5 rounded-2xl shadow">
    <h3 class="text-gray-500">Today's Applications</h3>
    <p id="todayApps" class="text-4xl font-bold text-blue-600">0</p>
  </div>

  <div class="bg-white p-5 rounded-2xl shadow">
    <h3 class="text-gray-500">Most Applied Class</h3>
    <p id="topClass" class="text-4xl font-bold text-blue-600">-</p>
  </div>
</div>
<div class="flex flex-wrap items-center justify-between gap-4 mb-6">

  <!-- Search -->
  <input
    type="text"
    id="searchInput"
    placeholder="Search..."
    class="px-4 py-3 border rounded-xl w-60"
  />

  <!-- Right Side Filters -->
  <div class="flex flex-wrap items-center gap-3">

    <!-- Submission Date -->
    <input
      type="date"
      id="dateFilter"
      class="px-4 py-3 border rounded-xl"
    />


    <!-- Class -->
    <select
      id="classFilter"
      class="px-4 py-3 border rounded-xl"
    >
      <option value="">All Classes</option>
      <option>Nursery</option>
      <option>LKG</option>
      <option>UKG</option>
      <option>Class I</option>
      <option>Class II</option>
      <option>Class III</option>
      <option>Class IV</option>
      <option>Class V</option>
      <option>Class VI</option>
      <option>Class VII</option>
      <option>Class VIII</option>
      <option>Class IX</option>
      <option>Class X</option>
    </select>

    <!-- Sort -->
    <select
      id="sortOrder"
      class="px-4 py-3 border rounded-xl"
    >
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
    </select>

  </div>

</div>




    <div class="bg-white rounded-2xl shadow overflow-x-auto">

        <table class="w-full">

            <thead class="bg-blue-600 text-white">
                <tr>
                    <th class="p-4 text-left">Student</th>
                    <th class="p-4 text-left">Parent</th>
                    <th class="p-4 text-left">Email</th>
                    <th class="p-4 text-left">Phone</th>
                    <th class="p-4 text-left">Class</th>
                    <th class="p-4 text-left">DOB</th>
                    <th class="p-4 text-left">Address</th>
                    <th class="p-4 text-left">Date</th>
                    <th class="p-4 text-left">Action</th>
                </tr>
            </thead>

            <tbody id="admissionsTable">
                <tr>
                    <td colspan="8" class="p-6 text-center">
                        Loading...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>
<section class="py-16">

  <div class="max-w-7xl mx-auto px-6">

    <div class="overflow-hidden bg-white rounded-[30px] shadow-xl border border-gray-100">

      <div class="p-8 border-b">
        
        <h2 class="text-3xl font-bold">
  Enquiries (<span id="totalEnquiries">0</span>)
</h2>
      </div>

      <table class="w-full">

        <thead class="bg-green-600 text-white">
          <tr>
            <th class="p-4 text-left">Parent Name</th>
            <th class="p-4 text-left">Email</th>
            <th class="p-4 text-left">Phone</th>
            <th class="p-4 text-left">Message</th>
            <th class="p-4 text-left">Date</th>
            <th class="p-4 text-left">Action</th>
          </tr>
        </thead>

        <tbody id="enquiriesTable"></tbody>

      </table>

    </div>

  </div>

</section>

<script>

const supabaseUrl = "https://qwwjrfhirhfoqwxravvm.supabase.co";
const supabaseKey = "sb_publishable_WAUBqL0FWHBrfvMb2pnCOA_B0No9ufJ";

const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function loadAdmissions() {

  const table = document.getElementById("admissionsTable");

  const selectedClass =
  document.getElementById("classFilter")?.value || "";

const selectedDate =
  document.getElementById("dateFilter")?.value || "";

const searchTerm =
  document.getElementById("searchInput")?.value.toLowerCase() || "";

  const sortOrder =
  document.getElementById("sortOrder")?.value || "newest";
  

  let query = supabaseClient
  .from("admissions")
  .select("*")
  .order("created_at", {
    ascending: sortOrder === "oldest"
  });

  if (selectedClass) {
    query = query.eq("class_name", selectedClass);
  }

  const { data, error } = await query;

  if (error) {
    console.log(error);
    return;
  }
// Total Applications
document.getElementById("totalApps").textContent = data.length;

// Today's Applications
const today = new Date().toISOString().split("T")[0];

const todayCount = data.filter(row =>
  row.created_at.startsWith(today)
).length;

document.getElementById("todayApps").textContent = todayCount;

// Most Applied Class
const classCounts = {};

data.forEach(row => {
  const cls = row.class_name || "Unknown";

  classCounts[cls] = (classCounts[cls] || 0) + 1;
});

let topClass = "-";
let maxCount = 0;

for (const cls in classCounts) {
  if (classCounts[cls] > maxCount) {
    maxCount = classCounts[cls];
    topClass = cls;
  }
}

document.getElementById("topClass").textContent = topClass;
  let filteredData = data;

  if (selectedDate) {
    filteredData = data.filter(row => {
      return row.created_at.startsWith(selectedDate);
    });
  }
if (searchTerm) {
  filteredData = filteredData.filter(row =>
    (row.student_name || "").toLowerCase().includes(searchTerm) ||
    (row.parent_name || "").toLowerCase().includes(searchTerm) ||
    (row.phone || "").toLowerCase().includes(searchTerm) ||
    (row.email || "").toLowerCase().includes(searchTerm)
  );
}
  table.innerHTML = "";

  filteredData.forEach(row => {

    table.innerHTML += `
      <tr class="border-b hover:bg-gray-50">

        <td class="p-4">${row.student_name || ""}</td>

        <td class="p-4">${row.parent_name || ""}</td>

        <td class="p-4">${row.email || ""}</td>

        <td class="p-4">${row.phone || ""}</td>

        <td class="p-4">${row.class_name || ""}</td>

        <td class="p-4">${row.dob || ""}</td>

        <td class="p-4">${row.address || ""}</td>

        <td class="p-4">
  ${new Date(row.created_at).toLocaleDateString()}
</td>

<td class="p-4">
  <button
    onclick="deleteStudent(${row.id})"
    class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm"
  >
    Delete
  </button>
</td>
        

      </tr>
    `;
  });

}



async function downloadCSV() {

    const { data, error } = await supabaseClient
        .from("admissions")
        .select("*")
        .order("created_at", { ascending: false });
        

    if (error) {
        alert("Error downloading data");
        return;
    }

    const headers = [
        "Student Name",
        "Parent Name",
        "Email",
        "Phone",
        "Class",
        "DOB",
        "Address",
        "Date"
    ];

    let csv = headers.join(",") + "\n";

    data.forEach(row => {
        csv += [
            `"${row.student_name || ""}"`,
            `"${row.parent_name || ""}"`,
            `"${row.email || ""}"`,
            `"${row.phone || ""}"`,
            `"${row.class_name || ""}"`,
            `"${row.dob || ""}"`,
            `"${row.address || ""}"`,
            `"${row.created_at || ""}"`
        ].join(",") + "\n";
    });

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);

    link.download = "quantum_admissions.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}
async function deleteStudent(id) {

  const confirmDelete = confirm(
    "Are you sure you want to delete this application?"
  );

  if (!confirmDelete) return;

  const { error } = await supabaseClient
    .from("admissions")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete Failed ❌");
    console.log(error);
  } else {
    alert("Deleted Successfully ✅");
    loadAdmissions();
  }
}

async function loadEnquiries() {
    const table = document.getElementById("enquiriesTable");

    if (!table) {
        console.error("enquiriesTable not found");
        return;
    }

    const { data, error } = await supabaseClient
        .from("enquiries")
        .select("*")
        .order("created_at", { ascending: false });

document.getElementById("totalEnquiries").textContent =
  data?.length || 0;



    if (error) {
        console.error(error);
        return;
    }

    table.innerHTML = "";

    data.forEach((row) => {
        const tr = document.createElement("tr");

        tr.className = "border-b hover:bg-gray-50";

        tr.innerHTML = `
            <td class="p-4">${row.parent_name || ""}</td>

            <td class="p-4">${row.email || ""}</td>

            <td class="p-4">${row.phone || ""}</td>

            <td class="p-4 max-w-xs truncate">
                ${row.message || ""}
            </td>

            <td class="p-4">
                ${new Date(row.created_at).toLocaleDateString()}
            </td>

            <td class="p-4">
                <button
                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm"
                    data-id="${row.id}"
                >
                    Delete
                </button>
            </td>
        `;

        const deleteBtn = tr.querySelector("button");

        deleteBtn.addEventListener("click", () => {
            deleteEnquiry(row.id);
        });

        table.appendChild(tr);
    });
}

async function deleteEnquiry(id) {
    const confirmDelete = confirm(
        "Are you sure you want to delete this enquiry?"
    );

    if (!confirmDelete) return;

    const { error } = await supabaseClient
        .from("enquiries")
        .delete()
        .eq("id", id);

    if (error) {
        console.error(error);
        alert("Delete Failed ❌");
        return;
    }

    alert("Deleted Successfully ✅");

    await loadEnquiries();
}

document.addEventListener("DOMContentLoaded", () => {
    loadEnquiries();
});
loadAdmissions();
loadEnquiries();

document
  .getElementById("classFilter")
  .addEventListener("change", loadAdmissions);

document
  .getElementById("dateFilter")
  .addEventListener("change", loadAdmissions);

document
  .getElementById("sortOrder")
  .addEventListener("change", loadAdmissions);

  document
  .getElementById("searchInput")
  .addEventListener("input", loadAdmissions);

  
</script>

</body>
</html>
