<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delta Classes - Achievements</title>

  <!-- AOS Animation CDN -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #050816;
      color: white;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 20px 8%;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      color: #a78bfa;
    }

    .nav-btn {
      padding: 10px 18px;
      border-radius: 25px;
      background: linear-gradient(90deg, #a78bfa, #ec4899);
      border: none;
      color: white;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 80px 10%;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      margin-top: 10px;
      color: #9ca3af;
    }

    /* Gallery */
    .gallery {
      padding: 50px 8%;
    }

    .gallery h2 {
      text-align: center;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.4s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: #a78bfa;
      box-shadow: 0 0 30px rgba(167,139,250,0.2);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .score {
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(90deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      color: transparent;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">Delta.</div>
    <button onclick="window.location.href='coachingenrollment.html'" class="nav-btn">Join Now</button>
    <button onclick="window.location.href='coaching.html'" class="nav-btn">HOME</button>
  </div>

  <!-- Hero -->
  <section class="hero" data-aos="fade-up">
    <h1>Our Achievements</h1>
    <p>Real results. Real success. Consistency every year.</p>
  </section>

  <!-- Gallery -->
  <section class="gallery">
    <h2 data-aos="fade-up">Top Results</h2>

    <div class="grid">

      <!-- Card 1 -->
      <div class="card" data-aos="zoom-in">
        <img src="images/topper1.jpeg" alt="">
        <div class="card-content">
          <h3>Arushi Sinha</h3>
          <div class="score">96.4%</div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card" data-aos="zoom-in">
        <img src="images/result1.jpeg" alt="">
        <div class="card-content">
          <h3>Pallavi Kri</h3>
          <div class="score">455 (91%)</div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card" data-aos="zoom-in">
        <img src="images/result2.jpeg" alt="">
        <div class="card-content">
          <h3>Ishaan Qayanat</h3>
          <div class="score">419 (IIT JEE)</div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="card" data-aos="zoom-in">
        <img src="images/result3.jpeg" alt="">
        <div class="card-content">
          <h3>Shatanshi Kri</h3>
          <div class="score">435</div>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <div class="footer">
    © 2026 Delta Classes — From Concept to Excellence
  </div>

  <!-- AOS Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });
  </script>

</body>
</html>
