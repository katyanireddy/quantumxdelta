<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissions Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-[#050B2C] text-white min-h-screen">
<script>
if (localStorage.getItem("coachingAdminAuth") !== "true") {

  alert("Access Denied ❌");

  window.location.href = "coaching.html";

}
</script>
<div class="max-w-7xl mx-auto p-6">

    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8">
        <h1 class="text-3xl md:text-5xl font-bold">
            Delta Admin Dashboard
        </h1>

        <div class="flex flex-wrap gap-3">
    <button
  onclick="refreshDashboard()"
  class="bg-gradient-to-r from-violet-500 via-fuchsia-500 to-orange-500 text-white px-4 py-2 rounded-xl">
  Refresh
</button>

<button
  onclick="downloadCSV()"
  class="bg-white/10 border border-white/10 text-white px-4 py-2 rounded-xl">
  Download Excel
</button>

<button
onclick="logoutAdmin()"
class="bg-red-500/80 text-white px-4 py-2 rounded-xl">
Logout
</button>
</div>
    </div>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
  <div class="bg-white/5 border border-white/10 backdrop-blur p-5 rounded-3xl">
    <h3 class="text-gray-400">Total Demo Bookings</h3>
    <p id="totalApps" class="text-4xl font-black bg-gradient-to-r from-violet-400 via-fuchsia-400 to-orange-400 bg-clip-text text-transparent">0</p>
  </div>

  <div class="bg-white/5 border border-white/10 backdrop-blur p-5 rounded-3xl">
    <h3 class="text-gray-400">Today's Bookings</h3>
    <p id="todayApps" class="text-4xl font-black bg-gradient-to-r from-violet-400 via-fuchsia-400 to-orange-400 bg-clip-text text-transparent">0</p>
  </div>

  <div class="bg-white/5 border border-white/10 backdrop-blur p-5 rounded-3xl">
    <h3 class="text-gray-400">Most Requested Class</h3>
    <p id="topClass" class="text-4xl font-black bg-gradient-to-r from-violet-400 via-fuchsia-400 to-orange-400 bg-clip-text text-transparent">-</p>
  </div>
</div>
<div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6">

  <!-- Search -->
  <input
    type="text"
    id="searchInput"
    placeholder="Search..."
    class="px-4 py-3 border rounded-xl w-full md:w-60 text-black bg-white focus:ring-2 focus:ring-violet-500 focus:outline-none justify-center"
  />

  <!-- Right Side Filters -->
  <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">

    <!-- Submission Date -->
    <input
      type="date"
      id="dateFilter"
      class="px-4 py-3 border rounded-xl w-full md:w-60 text-black bg-white focus:ring-2 focus:ring-violet-500 focus:outline-none"
    />


    <!-- Class -->
    <select
      id="classFilter"
      class="px-4 py-3 border rounded-xl w-full md:w-60 text-black bg-white focus:ring-2 focus:ring-violet-500 focus:outline-none"
    >
      <option value="">All Classes</option>
      <option>Nursery</option>
      <option>LKG</option>
      <option>UKG</option>
      <option>Class I</option>
      <option>Class II</option>
      <option>Class III</option>
      <option>Class IV</option>
      <option>Class V</option>
      <option>Class VI</option>
      <option>Class VII</option>
      <option>Class VIII</option>
      <option>Class IX</option>
      <option>Class X</option>
    </select>

    <!-- Sort -->
    <select
      id="sortOrder"
      class="px-4 py-3 border rounded-xl w-full md:w-60 text-black bg-white focus:ring-2 focus:ring-violet-500 focus:outline-none"
    >
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
    </select>

  </div>

</div>



<div class="overflow-x-auto rounded-3xl">
  <table class="w-full min-w-[900px]">

        <table class="w-full table-fixed">

            <thead class="bg-gradient-to-r from-violet-500 via-fuchsia-500 to-orange-500">
<tr>
  <th class="p-4 text-left">Student</th>
  <th class="p-4 text-left">Parent</th>
  <th class="p-4 text-left">Phone</th>
  <th class="p-4 text-left">Class</th>
  <th class="p-4 text-left">Message</th>
  <th class="p-4 text-left">Date</th>
  <th class="p-4 text-center">Action</th>
</tr>
</thead>

            <tbody id="admissionsTable">
                <tr>
                    <td colspan="7" class="p-6 text-center">
                        Loading...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>
</div>
</div>
<section class="py-16">

  <div class="max-w-7xl mx-auto px-6">

    <div class="bg-white/5 border border-white/10 rounded-3xl backdrop-blur mt-10">

  <div class="p-8 border-b">
    <h2 class="text-3xl font-bold">
      Enquiries (<span id="totalEnquiries">0</span>)
    </h2>
  </div>

  <div class="overflow-x-auto">

    <table class="min-w-[1000px] w-full">

      <thead class="bg-gradient-to-r from-violet-500 via-fuchsia-500 to-orange-500 text-white">
        <tr>
          <th class="p-4 text-left">Parent Name</th>
          <th class="p-4 text-left">Email</th>
          <th class="p-4 text-left">Phone</th>
          <th class="p-4 text-left">Message</th>
          <th class="p-4 text-left">Date</th>
          <th class="p-4 text-left">Action</th>
        </tr>
      </thead>

      <tbody id="enquiriesTable"></tbody>

    </table>

  </div>

</div>

  

</section>

<script>

const supabaseUrl = "https://qwwjrfhirhfoqwxravvm.supabase.co";
const supabaseKey = "sb_publishable_WAUBqL0FWHBrfvMb2pnCOA_B0No9ufJ";

const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function loadAdmissions() {

  const table = document.getElementById("admissionsTable");

  const selectedClass =
  document.getElementById("classFilter")?.value || "";

const selectedDate =
  document.getElementById("dateFilter")?.value || "";

const searchTerm =
  document.getElementById("searchInput")?.value.toLowerCase() || "";

  const sortOrder =
  document.getElementById("sortOrder")?.value || "newest";
  

  let query = supabaseClient
  .from("demo_bookings")
  .select("*")
  .order("created_at", {
    ascending: sortOrder === "oldest"
  });

  if (selectedClass) {
    query = query.eq("class_name", selectedClass);
  }

  const { data, error } = await query;

  if (error) {
    console.log(error);
    return;
  }
// Total Applications
document.getElementById("totalApps").textContent = data.length;

// Today's Applications
const today = new Date().toISOString().split("T")[0];

const todayCount = data.filter(row =>
  row.created_at.startsWith(today)
).length;

document.getElementById("todayApps").textContent = todayCount;

// Most Applied Class
const classCounts = {};

data.forEach(row => {
  const cls = row.class_name || "Unknown";

  classCounts[cls] = (classCounts[cls] || 0) + 1;
});

if (Object.keys(classCounts).length) {

  let maxCount = Math.max(...Object.values(classCounts));

  const topClasses = Object.keys(classCounts)
    .filter(cls => classCounts[cls] === maxCount);

  document.getElementById("topClass").textContent =
    topClasses.join(", ");

} else {

  document.getElementById("topClass").textContent = "-";

}

  
  let filteredData = data;

  if (selectedDate) {
    filteredData = data.filter(row => {
      return row.created_at.startsWith(selectedDate);
    });
  }
if (searchTerm) {
  filteredData = filteredData.filter(row =>
    (row.student_name || "").toLowerCase().includes(searchTerm) ||
    (row.parent_name || "").toLowerCase().includes(searchTerm) ||
    (row.phone || "").toLowerCase().includes(searchTerm) ||
    (row.class_name || "").toLowerCase().includes(searchTerm) ||
    (row.message || "").toLowerCase().includes(searchTerm)
  );
}
  table.innerHTML = "";
  if(filteredData.length === 0){
  table.innerHTML = `
  <tr>
    <td colspan="7" class="p-6 text-center text-gray-400">
      No Bookings Found
    </td>
  </tr>`;
  return;
}

  filteredData.forEach(row => {

    table.innerHTML += `
<tr class="border-b border-white/10 hover:bg-white/5">

<td class="p-4 whitespace-nowrap">
  ${row.student_name || ""}
</td>

<td class="p-4 whitespace-nowrap">
  ${row.parent_name || ""}
</td>

<td class="p-4 whitespace-nowrap">
  ${row.phone || ""}
</td>

<td class="p-4 whitespace-nowrap">
  ${row.class_name || ""}
</td>

<td class="p-4 max-w-[250px] truncate">
  ${row.message || ""}
</td>

<td class="p-4 whitespace-nowrap">
  ${new Date(row.created_at).toLocaleDateString()}
</td>

<td class="p-4 text-center">
  <button
    onclick="deleteStudent(${row.id})"
    class="bg-red-500 px-3 py-1 rounded-lg"
  >
    Delete
  </button>
</td>

</tr>

`;
  });

}



async function downloadCSV() {

    const { data, error } = await supabaseClient
        .from("demo_bookings")
        .select("*")
        .order("created_at", { ascending: false });
        

    if (error) {
        alert("Error downloading data");
        return;
    }

    const headers = [
  "Student Name",
  "Parent Name",
  "Phone",
  "Class",
  "Message",
  "Date"
];

    let csv = headers.join(",") + "\n";

    data.forEach(row => {
        csv += [
  `"${row.student_name || ""}"`,
  `"${row.parent_name || ""}"`,
  `"${row.phone || ""}"`,
  `"${row.class_name || ""}"`,
  `"${row.message || ""}"`,
  `"${row.created_at || ""}"`
].join(",") + "\n";
    });

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);

    link.download = "delta_bookings.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}
async function deleteBooking(id) {

  const confirmDelete = confirm(
    "Are you sure you want to delete this booking?"
  );

  if (!confirmDelete) return;

  const { error } = await supabaseClient
    .from("demo_bookings")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete Failed ❌");
    console.log(error);
  } else {
    alert("Deleted Successfully ✅");
    loadAdmissions();
  }
}

async function loadEnquiries() {
    const table = document.getElementById("enquiriesTable");

    if (!table) {
        console.error("enquiriesTable not found");
        return;
    }

    const { data, error } = await supabaseClient
        .from("coaching_enquiries")
        .select("*")
        .order("created_at", { ascending: false });

document.getElementById("totalEnquiries").textContent =
  data?.length || 0;



    if (error) {
        console.error(error);
        return;
    }

    table.innerHTML = "";

    data.forEach((row) => {
        const tr = document.createElement("tr");

        tr.className = "border-b hover:bg-gray-50";

        tr.innerHTML = `
            <td class="p-4">${row.name || ""}</td>

            <td class="p-4">${row.parent_name || ""}</td>

            <td class="p-4">${row.email || ""}</td>

            <td class="p-4">${row.phone || ""}</td>

            <td class="p-4 max-w-xs truncate">
                ${row.message || ""}
            </td>

            <td class="p-4">
                ${new Date(row.created_at).toLocaleDateString()}
            </td>

            <td class="p-4">
                <button
                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm"
                    data-id="${row.id}"
                >
                    Delete
                </button>
            </td>
        `;

        const deleteBtn = tr.querySelector("button");

        deleteBtn.addEventListener("click", () => {
            deleteEnquiry(row.id);
        });

        table.appendChild(tr);
    });
}

async function deleteEnquiry(id) {
    const confirmDelete = confirm(
        "Are you sure you want to delete this enquiry?"
    );

    if (!confirmDelete) return;

    const { error } = await supabaseClient
        .from("coaching_enquiries")
        .delete()
        .eq("id", id);

    if (error) {
        console.error(error);
        alert("Delete Failed ❌");
        return;
    }

    alert("Deleted Successfully ✅");

    await loadEnquiries();
}

document.addEventListener("DOMContentLoaded", () => {
    loadEnquiries();
});
loadAdmissions();
loadEnquiries();

document
  .getElementById("classFilter")
  .addEventListener("change", loadAdmissions);

document
  .getElementById("dateFilter")
  .addEventListener("change", loadAdmissions);

document
  .getElementById("sortOrder")
  .addEventListener("change", loadAdmissions);

  document
  .getElementById("searchInput")
  .addEventListener("input", loadAdmissions);

function logoutAdmin() {

  localStorage.removeItem("coachingAdminAuth");

  window.location.href = "coaching.html";

}

function refreshDashboard() {

  document.getElementById("searchInput").value = "";

  document.getElementById("classFilter").value = "";

  document.getElementById("dateFilter").value = "";

  document.getElementById("sortOrder").value = "newest";

  loadAdmissions();

}
</script>

</body>
</html>
